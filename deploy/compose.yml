# 参考部署：cloud + relay + PostgreSQL + Redis（平台设计 §16.4）。
#
# 生产环境应把 postgres / redis 换成托管服务；证书与签名密钥由运维提供并挂载；
# 滚动升级先升 relay、后升 cloud。配置写在同目录 .env（见 README.md 的变量表）。
#
# profile personal-cluster：两节点的个人中转（--store postgres --control postgres，schema relay_personal），
# 前面要自己放负载均衡（同一个源的隧道与客户端要落在同一个节点，按 /s/<sourceId>/ 粘住）：
#   printf '%s' '<口令>' > relay_password.txt && chmod 600 relay_password.txt
#   PERSONAL_RELAY_HOST=relay.example.com docker compose --profile personal-cluster up -d
# 单节点的个人中转不需要这些，用 personal/compose.yml。
name: armadra-cloud

services:
  cloud:
    image: ghcr.io/ama-link/armadra-cloud:${ARMADRA_CLOUD_VERSION:?set ARMADRA_CLOUD_VERSION}
    env_file: .env
    environment:
      ARMADRA_CLOUD_LISTEN: 0.0.0.0:8100
      ARMADRA_CLOUD_DATABASE_URL: "postgres://armadra:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/armadra_cloud"
      ARMADRA_CLOUD_REDIS_URL: redis://redis:6379
      ARMADRA_CLOUD_SIGNING_KEY_FILE: /run/secrets/signing_keys
      ARMADRA_CLOUD_REQUIRE_EMAIL_VERIFIED: "1"
    secrets:
      - signing_keys
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # saas serve 现在是只答 /health、/ready 的占位（Node 版与 Go 版一致），SaaS 中继节点随 #59 的 G5 接替。
  relay:
    image: ghcr.io/ama-link/armadra-relay:${ARMADRA_CLOUD_VERSION:?set ARMADRA_CLOUD_VERSION}
    command: ["saas", "serve"]
    env_file: .env
    environment:
      RELAY_CLOUD_ISSUER: http://cloud:8100
      RELAY_REDIS_URL: redis://redis:6379
      RELAY_TLS_CERT: /run/secrets/relay_cert
      RELAY_TLS_KEY: /run/secrets/relay_key
    secrets:
      - relay_cert
      - relay_key
    ports:
      - "443:8443"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  relay-personal-a: &relay-personal
    image: ghcr.io/ama-link/armadra-relay:${ARMADRA_CLOUD_VERSION:?set ARMADRA_CLOUD_VERSION}
    profiles: ["personal-cluster"]
    command:
      [
        "personal",
        "serve",
        "--port",
        "443",
        "--store",
        "postgres",
        "--control",
        "postgres",
      ]
    environment:
      &relay-personal-env # 对外的域名（多个节点同一个）；不设时 serve 报「缺少 --host」退出。
      RELAY_HOST: ${PERSONAL_RELAY_HOST:-}
      RELAY_DATABASE_URL: "postgres://armadra:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/armadra_cloud"
      RELAY_DATABASE_SCHEMA: relay_personal
      RELAY_NODE_ID: personal-a
      RELAY_PERSONAL_ACCOUNT: ${RELAY_ACCOUNT:-me}
      RELAY_PERSONAL_PASSWORD_FILE: /run/secrets/relay_password
    secrets:
      - relay_password
    volumes:
      - relay-personal-a:/data
    ports:
      - "8444:8443"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  relay-personal-b:
    <<: *relay-personal
    environment:
      <<: *relay-personal-env
      RELAY_NODE_ID: personal-b
    volumes:
      - relay-personal-b:/data
    ports:
      - "8445:8443"

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: armadra
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: armadra_cloud
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "armadra", "-d", "armadra_cloud"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.8.3-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

secrets:
  signing_keys:
    file: ./signing-keys.json
  relay_cert:
    file: ./tls/relay.crt
  relay_key:
    file: ./tls/relay.key
  relay_password:
    file: ./relay_password.txt

volumes:
  pg: {}
  relay-personal-a: {}
  relay-personal-b: {}
