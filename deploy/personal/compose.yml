# 单人中转：一个服务、不带外部数据库，不依赖 PostgreSQL / Redis（平台设计 §17）。
#
#   printf '%s' '<口令>' > deploy/personal/relay_password.txt && chmod 600 deploy/personal/relay_password.txt
#   （Linux 上再 sudo chown 10002 deploy/personal/relay_password.txt：镜像里以 armadra 用户运行）
#   RELAY_HOST=203.0.113.5 docker compose -f deploy/personal/compose.yml up -d
#   docker compose -f deploy/personal/compose.yml logs relay | grep fingerprint   # CA 指纹，客户端添加时比对
#
# 首次启动用 RELAY_ACCOUNT（缺省 me）与口令文件自动初始化；之后口令文件不再读取，改口令用
#   docker compose -f deploy/personal/compose.yml exec relay armadra-relay personal passwd --password-file /run/secrets/relay_password
# 缺省自签 TLS（CA 在卷里，/ca.crt 可下载）。有域名时把 command 换成 --tls acme --acme-email <邮箱>
# 并加映射 80:80；已有证书用 --tls file 与 RELAY_TLS_CERT / RELAY_TLS_KEY。
# 放在反向代理（OpenResty / nginx / CDN）后面：中继只看到代理的地址，按 IP 的限流与登录锁定会变成全站一个桶。
# 加 --trusted-proxy（或 RELAY_TRUSTED_PROXY）列出代理的 IP / CIDR，例如同机 OpenResty 用
#   --trusted-proxy 127.0.0.1/32,::1/128
# 只有直连对端在列表里才读 X-Forwarded-For（自右向左剔除受信跳数，取第一个不受信的地址）；
# 其余对端发来的转发头一律忽略。前面还有 CDN 时，把 CDN 的出口网段也列进去，或让 OpenResty 用
# real_ip 模块还原后写 X-Real-IP，再加 --trusted-proxy-prefer real-ip。代理要覆盖而不是追加客户端自带的头：
#   proxy_set_header X-Forwarded-For $remote_addr;   # 直接面向公网时
#   proxy_set_header X-Real-IP $remote_addr;
# 用状态文件（--store file）时也可写进 state.json 的 settings.trustedProxy: { "proxies": ["127.0.0.1/32"], "prefer": "forwarded-for" }；命令行优先。
# 服务端名称（客户端添加时的缺省显示名）：RELAY_NAME=家里（状态文件另可写 settings.displayName），缺省用 RELAY_HOST。
# 人机挑战（Turnstile，契约 §16，缺省关）：RELAY_CHALLENGE=turnstile RELAY_TURNSTILE_SITE_KEY=<站点密钥>，
#   secret 写进文件后加一个 secret 挂载并设 RELAY_TURNSTILE_SECRET_FILE=/run/secrets/<名字>（见 docs/runbooks/cloudflare-protection.md）。
# 存储：新装缺省 SQLite（卷里的 relay.db）；卷里还是 state.json 的（0.3.x 之前），0.10.0（Go 版）起要先停服
#   docker compose -f deploy/personal/compose.yml run --rm relay personal migrate --data-dir /data --to sqlite
# 迁过去（见 docs/runbooks/personal-storage.md）。检查：exec relay armadra-relay personal doctor --data-dir /data
# 流量统计：RELAY_TRAFFIC_RETENTION_DAYS 保留天数，缺省 90，0 = 不记录；查看用 exec relay armadra-relay personal traffic --data-dir /data。
# 指标（/metrics，缺省不开）：容器里要监听非回环地址宿主才抓得到，非回环（含 :端口、0.0.0.0、[::]）必须配令牌，
# 否则 serve 以配置错误退出 64。开的时候在 environment 加
#   RELAY_METRICS_LISTEN: 0.0.0.0:9100
#   RELAY_METRICS_TOKEN: "${RELAY_METRICS_TOKEN:?set RELAY_METRICS_TOKEN}"   # 例如 openssl rand -hex 24
# ports 加 "127.0.0.1:9100:9100"（只发布到宿主回环），抓取时带 Authorization: Bearer <令牌>。
# 以前在非回环地址开了指标却没配令牌的，升级后照上面补令牌；不需要从容器外抓就去掉 RELAY_METRICS_LISTEN。
# 页面：把 Armadra apps/web 的构建产物挂到 /app/web（或用带页面的镜像），否则 /app 答错误页。
# 0.10.0 起镜像是 Go 实现；回滚：ARMADRA_RELAY_IMAGE=ghcr.io/ama-link/armadra-relay:<上一版> 再 up -d，库格式相同
# （见 docs/runbooks/personal-storage.md「切换到 Go 版中继」）。
name: armadra-relay-personal

services:
  relay:
    image: ${ARMADRA_RELAY_IMAGE:-ghcr.io/ama-link/armadra-relay:latest}
    command:
      [
        "personal",
        "serve",
        "--host",
        "${RELAY_HOST:?set RELAY_HOST to your public IP or domain}",
        "--port",
        "${RELAY_PORT:-443}",
      ]
    environment:
      RELAY_DATA_DIR: /data
      RELAY_LISTEN: 0.0.0.0:8443
      RELAY_PERSONAL_ACCOUNT: "${RELAY_ACCOUNT:-me}"
      RELAY_PERSONAL_PASSWORD_FILE: /run/secrets/relay_password
      RELAY_NAME: "${RELAY_NAME:-}"
      RELAY_CHALLENGE: "${RELAY_CHALLENGE:-}"
      RELAY_TURNSTILE_SITE_KEY: "${RELAY_TURNSTILE_SITE_KEY:-}"
      RELAY_TURNSTILE_SECRET_FILE: "${RELAY_TURNSTILE_SECRET_FILE:-}"
      RELAY_CHALLENGE_SCOPE: "${RELAY_CHALLENGE_SCOPE:-}"
      RELAY_TRAFFIC_RETENTION_DAYS: "${RELAY_TRAFFIC_RETENTION_DAYS:-}"
    secrets:
      - relay_password
    ports:
      - "${RELAY_BIND:-0.0.0.0}:${RELAY_PORT:-443}:8443"
    volumes:
      - relay-data:/data
    restart: unless-stopped

secrets:
  relay_password:
    file: ./relay_password.txt

volumes:
  relay-data: {}
