packages:
  - packages/*

# 新发布的版本至少放 7 天再进锁文件（单位：分钟）。
minimumReleaseAge: 10080

# 与 Armadra 工程规范化 E0 同版的 lint 工具链；发布不满 7 天，逐个登记。
minimumReleaseAgeExclude:
  - globals@17.13.0
  - knip@6.39.0

allowBuilds:
  esbuild: true

storeDir: .pnpm-store

# 安全告警修补，上游发版后去掉。
overrides:
  # GHSA-68fv-2mgg-jv7q：只在 vitest 开发链（magicast、postcss）。
  source-map-js: 1.2.2
  # GHSA-g3hv-75wg-m249：minimatch 7.x 至 11.0.0，只在 typescript-eslint 的 lint 开发链。
  # 跨大版本（上游范围还没放到 11）；11.x 的具名导出不变，同时带 ESM 与 CJS。
  "minimatch@>=7.0.0 <11.0.1": 11.0.4
