packages:
  - apps/*
  - packages/*

# 新发布的版本至少放 7 天再进锁文件（单位：分钟）。
minimumReleaseAge: 10080

# 与 Armadra 工程规范化 E0 同版的 lint 工具链；发布不满 7 天，逐个登记。
minimumReleaseAgeExclude:
  - globals@17.13.0
  - knip@6.39.0

allowBuilds:
  esbuild: true

storeDir: .pnpm-store

# 安全告警修补，上游发版后去掉。
overrides:
  # GHSA-68fv-2mgg-jv7q：只在 vitest 开发链（magicast、postcss）。
  source-map-js: 1.2.2
