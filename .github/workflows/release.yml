# 打 v* 标签时发布：标签必须等于根 package.json 的版本；构建两个镜像推到
# ghcr.io/ama-link/armadra-{cloud,relay}:<版本>，再以 CHANGELOG 本版一节建 Release。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 标签与版本一致
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 package.json 版本 ${version} 不一致" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: 本版更新记录
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="## ${{ steps.version.outputs.version }}" '
            index($0, v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: 登录 GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 构建、冒烟并推送镜像
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          for app in cloud relay; do
            image="ghcr.io/ama-link/armadra-${app}"
            # 两个镜像都是 Go 构建。
            dockerfile="go/Dockerfile"
            [ "$app" = cloud ] && dockerfile="go/Dockerfile.cloud"
            args=()
            if [ "$app" = cloud ]; then
              # 控制台页面（Armadra 带控制台外壳的 web 产物）取 compat.json 的 web 版本，没有它 / 不托管页面。
              web="$(node -p "require('./deploy/compat.json').armadraServer.web")"
              args+=(--build-arg "WEB_IMAGE=ghcr.io/ama-link/armadra-server:${web}")
            fi
            docker build -f "$dockerfile" "${args[@]}" -t "${image}:${v}" -t "${image}:latest" .
          done
          # 冒烟过了才推。
          docker run --rm "ghcr.io/ama-link/armadra-relay:${v}" personal --help
          docker run --rm "ghcr.io/ama-link/armadra-cloud:${v}" version
          # 缺配置时 serve 以 64 退出并只列变量名（证明入口、用户与二进制可用）。
          set +e
          docker run --rm "ghcr.io/ama-link/armadra-cloud:${v}" serve
          [ "$?" -eq 64 ] || { echo "armadra-cloud serve 冒烟：退出码不是 64"; exit 1; }
          set -e
          for app in cloud relay; do
            image="ghcr.io/ama-link/armadra-${app}"
            docker push "${image}:${v}"
            docker push "${image}:latest"
          done

      - name: 建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "armadra-cloud ${{ steps.version.outputs.version }}" --notes-file notes.md
