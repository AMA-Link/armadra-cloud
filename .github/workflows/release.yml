# 打 v* 标签时发布：标签必须等于根 package.json 的版本；构建两个镜像推到
# ghcr.io/ama-link/armadra-{cloud,relay}:<版本>，再以 CHANGELOG 本版一节建 Release。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 标签与版本一致
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 package.json 版本 ${version} 不一致" >&2
            exit 1
          fi
          web="$(node -p "require('./deploy/compat.json').armadraServer.web")"
          {
            echo "version=${version}"
            echo "web=${web}"
          } >> "$GITHUB_OUTPUT"

      - name: 本版更新记录
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="## ${{ steps.version.outputs.version }}" '
            index($0, v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: 登录 GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 构建 armadra-cloud 镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: go/Dockerfile.cloud
          build-args: WEB_IMAGE=ghcr.io/ama-link/armadra-server:${{ steps.version.outputs.web }}
          tags: |
            ghcr.io/ama-link/armadra-cloud:${{ steps.version.outputs.version }}
            ghcr.io/ama-link/armadra-cloud:latest
          load: true
          cache-from: |
            type=gha,scope=armadra-cloud
            type=gha,scope=armadra-relay
          cache-to: type=gha,mode=max,scope=armadra-cloud

      - name: 构建 armadra-relay 镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: go/Dockerfile
          tags: |
            ghcr.io/ama-link/armadra-relay:${{ steps.version.outputs.version }}
            ghcr.io/ama-link/armadra-relay:latest
          load: true
          cache-from: |
            type=gha,scope=armadra-relay
            type=gha,scope=armadra-cloud
          cache-to: type=gha,mode=max,scope=armadra-relay

      - name: 冒烟并推送镜像
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          # 冒烟过了才推。
          docker run --rm "ghcr.io/ama-link/armadra-relay:${v}" personal --help
          docker run --rm "ghcr.io/ama-link/armadra-cloud:${v}" version
          # 缺配置时 serve 以 64 退出并只列变量名（证明入口、用户与二进制可用）。
          set +e
          docker run --rm "ghcr.io/ama-link/armadra-cloud:${v}" serve
          rc=$?
          set -e
          [ "$rc" -eq 64 ] || { echo "armadra-cloud serve 冒烟：退出码 ${rc} 不是 64" >&2; exit 1; }
          push_image() {
            local image="ghcr.io/ama-link/armadra-$1"
            docker push "${image}:${v}"
            docker push "${image}:latest"
          }
          push_image cloud &
          pid_cloud=$!
          push_image relay &
          pid_relay=$!
          wait "$pid_cloud"
          wait "$pid_relay"

      - name: 建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "armadra-cloud ${{ steps.version.outputs.version }}" --notes-file notes.md
