# 夜间：卫生（knip 报告、依赖审计）与跨仓端到端（personal 模式）。只读，不发布。
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: "12.8.1"
  NODE_VERSION: "24"

jobs:
  # 定时触发时，main 的提交与上次成功的 nightly 相同就跳过（workspace#9）；手动触发照跑。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.last.outputs.run }}
    steps:
      - id: last
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
            if [ "$last" = "$GITHUB_SHA" ]; then
              run=false
              echo "::notice::main 自上次成功的 nightly 以来没有新提交，跳过"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  hygiene:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: knip（只出报告）
        run: pnpm knip
      - name: 依赖审计（生产依赖，high 及以上失败）
        run: pnpm audit --prod --audit-level=high

  e2e:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    name: e2e-personal (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # latest：Armadra 主仓 main 现构建；compat-min：deploy/compat.json 的 min 镜像。
        server: [latest, compat-min]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm libs:build
      - name: 取 Armadra 主仓（构建 latest 用；主仓公开，没配 ARMADRA_REPO_TOKEN 就用默认令牌）
        if: matrix.server == 'latest'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AMA-Link/Armadra
          ref: main
          path: armadra
          token: ${{ secrets.ARMADRA_REPO_TOKEN || github.token }}
      - name: pnpm e2e --mode personal（服务器壳取 main 现构建）
        if: matrix.server == 'latest'
        env:
          ARMADRA_REPO: ${{ github.workspace }}/armadra
          ARMADRA_REF: worktree
        run: pnpm e2e --mode personal --output e2e-out
      - name: pnpm e2e --mode personal（服务器壳取 compat.min 镜像）
        if: matrix.server == 'compat-min'
        run: |
          image="$(node -p "const c=require('./deploy/compat.json').armadraServer; c.image + ':' + c.min")"
          docker pull "$image"
          pnpm e2e --mode personal --server-image "$image" --output e2e-out
      - name: 结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-personal-${{ matrix.server }}
          path: e2e-out/result.json
          if-no-files-found: ignore

  # SaaS 端到端（SaaS 实施设计 §8.4）：真实控制面 + 两个节点 + 一次性 PostgreSQL / Redis / mailpit 容器对假 core——
  # 账号与团队、授予与断言、经节点转发、撤销、停用、排空、Redis 清空后重放、泄密扫描；再跑只有节点的用例
  # （saas-nodes：测试签发者代替控制面，10 MB 双向转发、慢客户端、节点下线再平衡）。只依赖本仓与 Docker。
  e2e-saas:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    name: e2e-saas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm libs:build
      - name: pnpm e2e --mode saas
        run: pnpm e2e --mode saas --output e2e-out
      - name: pnpm e2e --mode saas-nodes
        run: pnpm e2e --mode saas-nodes --output e2e-out-nodes
      - name: 结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-saas
          path: |
            e2e-out/result.json
            e2e-out-nodes/result.json
          if-no-files-found: ignore
