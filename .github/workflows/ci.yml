# PR 与 main 的检查。只做检查与本地镜像构建，不推送、不发布任何东西。
#
# PostgreSQL 与 Redis 作为服务容器，给 test:integration 用；版本与
# deploy/dev/compose.yml 相同。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: "12.8.1"
  NODE_VERSION: "24"

jobs:
  # 先判断改了什么（workspace#9）：只改文档（Markdown 与 docs/，契约与第三方声明
  # 除外）或只改 go/ 时，TS 的完整检查与端到端跳过，只跑下面的 docs 作业（格式与仓库规则）；
  # 反过来，没碰 go/ 与它的输入（协议包的 schema、夹具、身份向量，常见口令表）时 go 作业跳过。
  # go/go.mod 与 go.sum 两边都算：第三方声明（notices:check）在 TS 作业里核对。
  # 推到 main 同理。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      go: ${{ steps.diff.outputs.go }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          code=false
          go=false
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null || [ "$GITHUB_REF_TYPE" = tag ]; then
            code=true
            go=true
          else
            files=$(git diff --name-only "$BASE" HEAD)
            [ -z "$files" ] && code=true && go=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                go/go.mod | go/go.sum) code=true; go=true ;;
                go/*) code=true; go=true ;; # 镜像（go/Dockerfile）由 go/ 构建：只改 go/ 也要构建并冒烟
                packages/control-store-*/* | packages/control-core/src/* | packages/cloud-shared/src/jwt.ts | apps/relay/src/personal/state.ts | apps/relay/src/personal/snapshot.ts) code=true; go=true ;;
                packages/platform-protocol/schema/* | packages/platform-protocol/fixtures/* | packages/platform-protocol/src/identity-vectors/* | packages/control-core/src/common-passwords.txt | scripts/go-check.mjs | .github/workflows/* | package.json | repo.rules.json) code=true; go=true ;;
                THIRD_PARTY_NOTICES.md | docs/contracts/*) code=true ;;
                *.md | docs/* | .github/ISSUE_TEMPLATE/*) ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "TS 检查：$([ $code = true ] && echo 要跑 || echo 跳过)；Go 检查：$([ $go = true ] && echo 要跑 || echo 跳过)"

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.code != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION || 24 }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm repo:check

  # Go：gofmt、go vet、staticcheck、race 测试与生成物新鲜度（pnpm go:check），
  # amd64 与 arm64 各一遍。存储的合同测试要真的 PostgreSQL（服务容器，镜像与 check 作业同一个版本），
  # 兼容测试要 TypeScript 依赖（装依赖并构建协议包）：Go 写的库交给 TypeScript 的存储读回来。
  go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.8.3-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARMADRA_CLOUD_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm libs:build
      - run: pnpm go:check

  check:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.8.3-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # notices:check 要从 Go 模块缓存读许可证。
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go/go.mod
          cache: false

      - run: pnpm install --frozen-lockfile

      # libs:build + prettier + eslint（只有 error 失败）+ typecheck + repo:check +
      # contract:check + protocol:check（夹具与向量）+ ci:workflows + notices:check（含 Go 模块）
      - run: pnpm check

      - run: pnpm repo:test

      - name: 单测（带覆盖率报告，不设门槛）
        run: pnpm test
        env:
          ARMADRA_COVERAGE: "1"

      - name: 集成测试（PostgreSQL 17 + Redis 8 服务容器）
        run: pnpm test:integration
        env:
          ARMADRA_CLOUD_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379

      - name: 协议包打包（pnpm pack 出 tgz 并核对内容，不发布）
        run: pnpm protocol:pack --out "$RUNNER_TEMP/pack"

      - name: 构建两个镜像（只 --load，不推送）
        run: pnpm images:build

      - name: 镜像冒烟
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm armadra-relay:local personal --help
          docker run --rm armadra-cloud:local version

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 7

  terraform:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # 区域设置（deploy/cloudflare/terraform）只做格式与语法校验：不给令牌、不连 Cloudflare 账号、
    # 不 plan / apply（那是维护者在本机做的事）。init 只下载 provider，不建 state。
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform -chdir=deploy/cloudflare/terraform fmt -check -diff -recursive
      - name: terraform validate（不连账号）
        run: |
          terraform -chdir=deploy/cloudflare/terraform init -backend=false -input=false
          terraform -chdir=deploy/cloudflare/terraform validate -no-color
