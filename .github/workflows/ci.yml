# PR 与 main 的检查。只做检查与本地镜像构建，不推送、不发布任何东西。
#
# PostgreSQL、Redis 与 mailpit 作为 go 作业的服务容器；版本与
# deploy/dev/compose.yml 相同。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: "12.21.0"
  NODE_VERSION: "24"

jobs:
  # 先按改动路径拆出四路开关（与 tools/hooks/pre-push.mjs 的 classify 同步）：
  # - code：TS、协议、声明、工作流与仓库配置；
  # - go：go/、协议生成物输入、deploy/README.md（Go 测试按路径读它）；
  # - images：go/ 与 go/Dockerfile*（两个 Go 镜像独立并行构建并冒烟）；
  # - terraform：deploy/cloudflare/terraform/*。
  # 四路都为 false（只改 Markdown、docs/ 或 issue 模板）时只跑轻量的 docs 作业。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      go: ${{ steps.diff.outputs.go }}
      images: ${{ steps.diff.outputs.images }}
      terraform: ${{ steps.diff.outputs.terraform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - id: diff
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          code=false
          go=false
          images=false
          terraform=false
          if [ -n "${BASE:-}" ] && [[ ! "$BASE" =~ ^0+$ ]] && [ "${GITHUB_REF_TYPE:-}" != tag ] && ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null ||
              git fetch --no-tags --unshallow origin 2>/dev/null || true
          fi
          if [ -z "${BASE:-}" ] || [ "${GITHUB_REF_TYPE:-}" = tag ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=true
            go=true
            images=true
            terraform=true
          else
            files=$(git diff --name-only "$BASE" HEAD)
            if [ -z "$files" ]; then
              code=true
              go=true
              images=true
              terraform=true
            fi
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                go/go.mod | go/go.sum)
                  code=true; go=true; images=true ;;
                go/Dockerfile*)
                  images=true ;;
                go/*)
                  go=true; images=true ;;
                deploy/cloudflare/terraform/*)
                  terraform=true ;;
                deploy/README.md)
                  go=true ;;
                packages/platform-protocol/schema/* | packages/platform-protocol/fixtures/* | packages/platform-protocol/src/identity-vectors/* | scripts/go-check.mjs)
                  code=true; go=true ;;
                .github/workflows/* | package.json | pnpm-lock.yaml | repo.rules.json)
                  code=true; go=true; images=true; terraform=true ;;
                THIRD_PARTY_NOTICES.md | docs/contracts/*)
                  code=true ;;
                *.md | docs/* | .github/ISSUE_TEMPLATE/*)
                  ;;
                *)
                  code=true ;;
              esac
            done <<< "$files"
          fi
          {
            echo "code=$code"
            echo "go=$go"
            echo "images=$images"
            echo "terraform=$terraform"
          } >> "$GITHUB_OUTPUT"
          echo "TS 检查：$code；Go 检查：$go；镜像构建：$images；Terraform：$terraform"

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.code != 'true' && needs.changes.outputs.go != 'true' && needs.changes.outputs.images != 'true' && needs.changes.outputs.terraform != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION || 24 }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: pnpm repo:check

  # Go：gofmt、go vet、staticcheck、race 测试与生成物新鲜度（pnpm go:check），
  # amd64 与 arm64 各一遍。存储的合同测试要真的 PostgreSQL（tmpfs 加速 I/O）；
  # 兼容测试只读 go/testdata/compat 的冻结夹具，不再调 TypeScript 的存储。
  go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - "5432:5432"
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:8.8.3-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - "1025:1025"
          - "8025:8025"
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      ARMADRA_CLOUD_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      MAILPIT_SMTP_ADDR: localhost:1025
      MAILPIT_API_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: go/bin/tools
          key: staticcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go/go.mod', 'scripts/go-check.mjs') }}
      - run: node tools/repo-check.mjs
      - run: node scripts/go-check.mjs

  check:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # notices:check 要从 Go 模块缓存读许可证。
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/.cache/prettier
            node_modules/.cache/eslint
            packages/*/node_modules/.cache/tsc
          key: check-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tsconfig.base.json') }}-${{ github.sha }}
          restore-keys: |
            check-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tsconfig.base.json') }}-

      # libs:build 后并行跑 prettier、eslint、typecheck、repo:check、contract:check、
      # protocol:check、ci:workflows、notices:check（含 Go 模块）与 repo:test。
      - name: 静态检查与仓库工具测试（并行）
        run: node tools/ci/check-ci.mjs

      - name: 单测（带覆盖率报告，不设门槛）
        run: pnpm test
        env:
          ARMADRA_COVERAGE: "1"

      - name: 协议包打包（pnpm pack 出 tgz 并核对内容，不发布）
        run: pnpm protocol:pack --out "$RUNNER_TEMP/pack"

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 7

  images:
    needs: changes
    if: ${{ needs.changes.outputs.images == 'true' }}
    name: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: 构建 armadra-cloud 镜像（只 --load，不推送）
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: go/Dockerfile.cloud
          tags: armadra-cloud:local
          load: true
          cache-from: |
            type=gha,scope=armadra-cloud
            type=gha,scope=armadra-relay
          cache-to: type=gha,mode=max,scope=armadra-cloud
      - name: 构建 armadra-relay 镜像（只 --load，不推送）
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: go/Dockerfile
          tags: armadra-relay:local
          load: true
          cache-from: |
            type=gha,scope=armadra-relay
            type=gha,scope=armadra-cloud
          cache-to: type=gha,mode=max,scope=armadra-relay
      - name: 镜像冒烟
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm armadra-relay:local personal --help
          docker run --rm armadra-cloud:local version
          set +e
          docker run --rm armadra-cloud:local serve
          rc=$?
          set -e
          [ "$rc" -eq 64 ] || { echo "armadra-cloud serve 冒烟：退出码 ${rc} 不是 64" >&2; exit 1; }

  terraform:
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' }}
    # 区域设置（deploy/cloudflare/terraform）只做格式与语法校验：不给令牌、不连 Cloudflare 账号、
    # 不 plan / apply（那是维护者在本机做的事）。init 只下载 provider，不建 state。
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('deploy/cloudflare/terraform/**/*.tf', 'deploy/cloudflare/terraform/.terraform.lock.hcl') }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform -chdir=deploy/cloudflare/terraform fmt -check -diff -recursive
      - name: terraform validate（不连账号）
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform -chdir=deploy/cloudflare/terraform init -backend=false -input=false
          terraform -chdir=deploy/cloudflare/terraform validate -no-color
