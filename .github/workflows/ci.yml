# PR 与 main 的检查。只做检查与本地镜像构建，不推送、不发布任何东西。
#
# PostgreSQL 与 Redis 作为服务容器，给 test:integration 用；版本与
# deploy/dev/compose.yml 相同。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: "12.8.1"
  NODE_VERSION: "24"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.8.3-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # libs:build + prettier + eslint（只有 error 失败）+ typecheck + repo:check +
      # contract:check + protocol:check（夹具与向量）+ ci:workflows + notices:check
      - run: pnpm check

      - run: pnpm repo:test

      - name: 单测（带覆盖率报告，不设门槛）
        run: pnpm test
        env:
          ARMADRA_COVERAGE: "1"

      - name: 集成测试（PostgreSQL 17 + Redis 8 服务容器）
        run: pnpm test:integration
        env:
          ARMADRA_CLOUD_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379

      - name: 协议包打包（pnpm pack 出 tgz 并核对内容，不发布）
        run: pnpm protocol:pack --out "$RUNNER_TEMP/pack"

      - name: 构建两个镜像（只 --load，不推送）
        run: pnpm images:build

      - name: 镜像冒烟
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm armadra-relay:local personal --help
          docker run --rm armadra-cloud:local version

      - name: 上传覆盖率
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 7

  terraform:
    # 区域设置（deploy/cloudflare/terraform）只做格式与语法校验：不给令牌、不连 Cloudflare 账号、
    # 不 plan / apply（那是维护者在本机做的事）。init 只下载 provider，不建 state。
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform -chdir=deploy/cloudflare/terraform fmt -check -diff -recursive
      - name: terraform validate（不连账号）
        run: |
          terraform -chdir=deploy/cloudflare/terraform init -backend=false -input=false
          terraform -chdir=deploy/cloudflare/terraform validate -no-color
